<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="forgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190e07"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="8" fill="url(#forgeBg)" stroke="#f97316" stroke-width="2"/>
  <rect width="600" height="34" rx="8" fill="#1f1109" stroke="#4a2510" stroke-width="1"/>
  <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="17" r="4.5" fill="#eab308"/>
  <circle cx="52" cy="17" r="4.5" fill="#22c55e"/>
  <text x="80" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#fb923c" font-weight="bold">DEVOPS FORGE // CI/CD PIPELINE ACCELERATOR</text>
  <text x="580" y="22" font-family="'Space Mono', monospace" font-size="10" fill="#f97316" text-anchor="end">TIME REDUCTION: -75%</text>

  <!-- CI/CD visual timeline comparison -->
  <g transform="translate(40, 55)">
    <!-- Legacy Pipeline -->
    <text x="0" y="20" font-family="'Space Mono', monospace" font-size="10" fill="#ea580c">LEGACY PIPELINE (120 MIN)</text>
    <rect x="0" y="28" width="520" height="26" rx="4" fill="#3b1b0b" stroke="#7c2d12" stroke-width="1"/>
    <rect x="2" y="30" width="516" height="22" rx="3" fill="#991b1b" opacity="0.8"/>
    <text x="260" y="45" font-family="'Space Mono', monospace" font-size="9" fill="#fef2f2" text-anchor="middle">Serial Build, Test, Security &amp; Docker Image Layer Push [120 min]</text>

    <!-- Optimized Sharded Pipeline -->
    <text x="0" y="80" font-family="'Space Mono', monospace" font-size="10" fill="#22c55e">ACCELERATED SHARDED RUNNERS (30 MIN // 4X VELOCITY)</text>
    <rect x="0" y="88" width="130" height="30" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="65" y="107" font-family="'Space Mono', monospace" font-size="9" fill="#f0fdf4" text-anchor="middle">Shard 1 (8m)</text>

    <rect x="140" y="88" width="130" height="30" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="205" y="107" font-family="'Space Mono', monospace" font-size="9" fill="#f0fdf4" text-anchor="middle">Shard 2 (9m)</text>

    <rect x="280" y="88" width="130" height="30" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="345" y="107" font-family="'Space Mono', monospace" font-size="9" fill="#f0fdf4" text-anchor="middle">Docker Cache (6m)</text>

    <rect x="420" y="88" width="100" height="30" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
    <text x="470" y="107" font-family="'Space Mono', monospace" font-size="9" fill="#f0fdf4" text-anchor="middle">Deploy (7m)</text>
  </g>

  <!-- Output log box -->
  <g transform="translate(40, 215)">
    <rect width="520" height="125" rx="6" fill="#100904" stroke="#361a08" stroke-width="1"/>
    <text x="20" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#fb923c">&gt; METRIC: Pipeline runtime crashed from 120m down to 30m</text>
    <text x="20" y="52" font-family="'Space Mono', monospace" font-size="9" fill="#fed7aa">&gt; OPTIMIZATION: Multi-stage Docker build layer caching mounted</text>
    <text x="20" y="74" font-family="'Space Mono', monospace" font-size="9" fill="#fed7aa">&gt; SHARDING: JUnit 5 test runner split across 4 concurrent nodes</text>
    <text x="20" y="96" font-family="'Space Mono', monospace" font-size="9" fill="#fed7aa">&gt; INFRASTRUCTURE: 4x developer feedback turnaround and compute savings</text>
    <text x="20" y="116" font-family="'Space Mono', monospace" font-size="9" fill="#22c55e">&gt; STATUS: Production Forge active across all release branches</text>
  </g>
</svg>
