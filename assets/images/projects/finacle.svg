<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="finacleBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140b0f"/>
      <stop offset="100%" stop-color="#24121b"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b08d3c"/>
    </linearGradient>
  </defs>
  <!-- Frame Window -->
  <rect width="600" height="380" rx="8" fill="url(#finacleBg)" stroke="#b08d3c" stroke-width="2"/>
  <!-- Window Header -->
  <rect width="600" height="34" rx="8" fill="#1e1018" stroke="#3d212f" stroke-width="1"/>
  <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="17" r="4.5" fill="#eab308"/>
  <circle cx="52" cy="17" r="4.5" fill="#22c55e"/>
  <text x="80" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#d4af37" font-weight="bold">FINACLE CORE // TIER-1 BANKING ENGINE</text>
  <text x="580" y="22" font-family="'Space Mono', monospace" font-size="10" fill="#766953" text-anchor="end">ACID: VERIFIED</text>
  
  <!-- Diagram Architecture -->
  <g transform="translate(40, 60)">
    <!-- Stage 1: Ingest -->
    <rect x="0" y="40" width="120" height="70" rx="4" fill="#2d1723" stroke="#b08d3c" stroke-width="1.5"/>
    <text x="60" y="68" font-family="'Space Mono', monospace" font-size="10" fill="#fef08a" text-anchor="middle" font-weight="bold">TRANSACTION</text>
    <text x="60" y="86" font-family="sans-serif" font-size="9" fill="#e6dabf" text-anchor="middle">Payload Stream</text>
    <text x="60" y="98" font-family="sans-serif" font-size="8" fill="#9e1d1d" text-anchor="middle">Limits &amp; Covenants</text>

    <!-- Arrow 1 -->
    <line x1="120" y1="75" x2="165" y2="75" stroke="#d4af37" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="165,71 173,75 165,79" fill="#d4af37"/>

    <!-- Stage 2: Dual Maker-Checker Engine -->
    <rect x="175" y="20" width="160" height="110" rx="6" fill="#3a1b2b" stroke="url(#goldEdge)" stroke-width="2"/>
    <text x="255" y="45" font-family="'Space Mono', monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">MAKER-CHECKER</text>
    <rect x="190" y="55" width="130" height="28" rx="3" fill="#1f0d16" stroke="#b08d3c" stroke-width="1"/>
    <text x="255" y="73" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Dual-Auth Pipeline</text>
    <rect x="190" y="90" width="130" height="28" rx="3" fill="#1f0d16" stroke="#b08d3c" stroke-width="1"/>
    <text x="255" y="108" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">Covenant Validation</text>

    <!-- Arrow 2 -->
    <line x1="335" y1="75" x2="380" y2="75" stroke="#d4af37" stroke-width="2"/>
    <polygon points="380,71 388,75 380,79" fill="#d4af37"/>

    <!-- Stage 3: Storage Vault -->
    <rect x="390" y="40" width="130" height="70" rx="4" fill="#2d1723" stroke="#b08d3c" stroke-width="1.5"/>
    <text x="455" y="68" font-family="'Space Mono', monospace" font-size="10" fill="#fef08a" text-anchor="middle" font-weight="bold">ORACLE &amp; PG</text>
    <text x="455" y="86" font-family="sans-serif" font-size="9" fill="#e6dabf" text-anchor="middle">Partitioned B-Tree</text>
    <text x="455" y="98" font-family="sans-serif" font-size="8" fill="#34d399" text-anchor="middle">79 Defects Cleared</text>
  </g>

  <!-- Metrics Output Row -->
  <g transform="translate(40, 230)">
    <rect width="520" height="100" rx="6" fill="#170c12" stroke="#4a2536" stroke-width="1"/>
    <text x="20" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#b08d3c">&gt; SYSTEM HEALTH: 99.99% INTEGRITY METRIC</text>
    <text x="20" y="48" font-family="'Space Mono', monospace" font-size="9" fill="#f3ebd9">&gt; THREADS: 1,200 concurrent ledger transactions processed &lt;15ms</text>
    <text x="20" y="66" font-family="'Space Mono', monospace" font-size="9" fill="#f3ebd9">&gt; ENFORCEMENT: Zero-tolerance dual signatures applied across all balances</text>
    <text x="20" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#34d399">&gt; STATUS: Production Tier-1 Banking Core Operational</text>
  </g>
</svg>
